<html lang="en">
<head>

<meta property="og:type" content="website">
<meta property="og:title" content="A little something for Clare 💐">
<meta property="og:description" content="Special delivery. Tap to open.">
<meta property="og:image" content="https://hturcotte1.github.io/CG/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #5b2737;
    --ink-soft: #9a6474;
    --accent: #e4557c;
    --accent-deep: #c2365f;
    --card: #fffaf3;
    --bg-top: #ffe1ea;
    --bg-mid: #fff1e8;
    --bg-bottom: #ffe6d9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% 0%, #fff6f0 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
    background-color: var(--bg-mid);
    color: var(--ink);
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- falling petals ---------- */
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .petal {
    position: absolute; top: -6vh; display: block;
    animation: fall var(--d) linear var(--delay) infinite;
  }
  .petal b {
    display: block;
    width: calc(14px * var(--s)); height: calc(11px * var(--s));
    border-radius: 80% 0 80% 0;
    background: var(--c);
    opacity: .7;
    animation: flutter calc(var(--d) / 3.5) ease-in-out var(--delay) infinite alternate;
  }
  @keyframes fall { to { transform: translateY(115vh); } }
  @keyframes flutter {
    from { transform: translateX(calc(var(--sway) * -1)) rotate(-40deg); }
    to   { transform: translateX(var(--sway)) rotate(200deg); }
  }

  /* ---------- layout ---------- */
  .app {
    position: relative; z-index: 2;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(env(safe-area-inset-top), 18px) 16px max(env(safe-area-inset-bottom), 14px);
  }
  header { text-align: center; flex: none; max-width: 32rem; }
  .eyebrow {
    margin: 0; font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 400;
  }
  h1 {
    margin: 2px 0 6px; font-style: italic; font-weight: 500;
    font-size: clamp(52px, 15vw, 88px); line-height: 1; color: var(--accent-deep);
    letter-spacing: -.01em;
  }
  h1 .heart {
    display: inline-block; width: .32em; height: .32em; margin-left: .06em;
    vertical-align: .55em; color: var(--accent);
    animation: beat 1.6s ease-in-out infinite;
  }
  h1 .heart svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }

  .lead-wrap { display: grid; max-width: 22.5em; margin: 0 auto; }
  .lead-wrap > p { grid-area: 1 / 1; align-self: center; margin: 0; font-size: clamp(16px, 4.3vw, 19px); line-height: 1.42; transition: opacity .7s ease, transform .7s ease; }
  .lead-real { opacity: 0; transform: translateY(8px); }
  .opened .lead-intro { opacity: 0; transform: translateY(-6px); }
  .opened .lead-real { opacity: 1; transform: none; }

  .stage { position: relative; flex: 1 1 auto; width: 100%; max-width: 560px; min-height: 0; margin-top: 4px; }

  /* ---------- envelope ---------- */
  .intro {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    transition: opacity .5s ease;
  }
  .intro.gone { opacity: 0; pointer-events: none; }
  .envelope {
    position: relative; width: min(270px, 72vw); aspect-ratio: 3 / 2;
    border: 0; padding: 0; background: none; cursor: pointer;
    perspective: 900px;
    animation: hover 2.8s ease-in-out infinite;
    transition: transform .5s ease, opacity .5s ease;
  }
  .envelope:focus-visible { outline: 3px solid var(--accent); outline-offset: 10px; border-radius: 14px; }
  .envelope > span { position: absolute; display: block; }
  .env-back { inset: 0; border-radius: 12px; background: #f2a3b7; box-shadow: 0 22px 40px -20px rgba(150, 40, 80, .55); z-index: 1; }
  .letter {
    left: 7%; right: 7%; top: 6%; height: 84%;
    background: var(--card); border-radius: 8px; z-index: 2;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 10%;
    font-family: "Caveat", cursive; font-size: 30px; font-weight: 700; color: var(--accent-deep);
    transition: transform .8s cubic-bezier(.3, 1.35, .5, 1);
    box-shadow: 0 2px 6px rgba(120, 40, 60, .12);
  }
  .env-sides { inset: 0; border-radius: 12px; background: #fbc4d1; z-index: 3;
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
  .env-bottom { inset: 0; border-radius: 12px; background: #f8b2c3; z-index: 4;
    clip-path: polygon(0 100%, 50% 48%, 100% 100%); }
  .env-flap {
    left: 0; right: 0; top: 0; height: 60%; z-index: 5;
    background: #f59ab0; border-radius: 12px 12px 0 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0;
    transition: transform .6s cubic-bezier(.5, 0, .3, 1), background-color .6s ease;
  }
  .seal {
    left: 50%; top: 60%; width: 46px; height: 46px; z-index: 6;
    transform: translate(-50%, -50%);
    transition: transform .35s cubic-bezier(.5, -0.6, .7, 1), opacity .3s ease;
    filter: drop-shadow(0 3px 4px rgba(140, 30, 60, .35));
  }
  .seal svg { width: 100%; height: 100%; display: block; fill: #d9345f; }
  .envelope.open { animation: none; }
  .envelope.open .seal { transform: translate(-50%, -50%) scale(0) rotate(-30deg); opacity: 0; }
  .envelope.open .env-flap { transform: rotateX(180deg); background-color: #ee8ea7; }
  .envelope.flap-back .env-flap { z-index: 0; }
  .envelope.lift .letter { transform: translateY(-58%); }
  .envelope.leaving { transform: translateY(40px) scale(.86); opacity: 0; }
  @keyframes hover { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }

  .contents { margin: 0; font-style: italic; font-size: 15px; color: var(--ink-soft); }
  .tap-hint {
    margin: -8px 0 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

  /* ---------- bouquet ---------- */
  #bouquet { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; overflow: visible; }
  #bouquet.on { visibility: visible; }
  .p { transform-box: fill-box; transform-origin: 50% 100%; }
  .c, .dot, .hd { transform-box: fill-box; transform-origin: 50% 50%; }
  .hd.bot { transform-origin: 50% 100%; }
  .leaf { transform-box: fill-box; transform-origin: 0% 60%; }
  .pop { transform-box: fill-box; transform-origin: 50% 50%; }
  .rise { transform-box: fill-box; transform-origin: 50% 100%; }
  #tagSwing { transform-box: fill-box; transform-origin: 6% 8%; }
  .bob { transform-box: fill-box; transform-origin: 50% 50%; }
  .ready .bob { animation: bob var(--bd, 4s) ease-in-out var(--bdel, 0s) infinite alternate; }
  .ready #sway { animation: sway 7s ease-in-out infinite alternate; }
  .ready #tagSwing { animation: tag 3.2s ease-in-out infinite alternate; }
  #sway { transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes sway { from { transform: rotate(-.7deg); } to { transform: rotate(.7deg); } }
  @keyframes tag { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }

  /* ---------- bottom bar ---------- */
  .bar {
    flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding-top: 6px;
    opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity .8s ease, transform .8s ease;
  }
  .ready .bar { opacity: 1; transform: none; pointer-events: auto; }
  .note-btn {
    font: inherit; font-size: 15.5px; color: var(--ink);
    background: rgba(255, 255, 255, .78); border: 1px solid rgba(228, 85, 124, .35);
    padding: 11px 20px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px -12px rgba(160, 40, 80, .5);
    transition: transform .15s ease, background-color .2s ease;
  }
  .note-btn:hover { background: #fff; }
  .note-btn:active { transform: scale(.96); }
  .note-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .meta { margin: 0; font-size: 13px; color: var(--ink-soft); font-style: italic; text-align: center; }
  .meta b { font-style: normal; font-weight: 600; color: var(--accent-deep); }

  /* ---------- note card ---------- */
  .note {
    position: fixed; left: 50%; bottom: calc(max(env(safe-area-inset-bottom), 14px) + 96px);
    width: min(320px, calc(100vw - 48px));
    background: var(--card); color: var(--ink);
    padding: 20px 20px 16px; border-radius: 14px;
    font-family: "Caveat", cursive; font-size: 25px; font-weight: 500; line-height: 1.18; text-align: center;
    box-shadow: 0 20px 40px -18px rgba(120, 30, 60, .45), 0 1px 0 rgba(0, 0, 0, .04);
    z-index: 6; cursor: pointer;
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 14px) rotate(-2deg) scale(.92);
    transition: opacity .3s ease, transform .4s cubic-bezier(.3, 1.4, .5, 1);
  }
  .note::before {
    content: ""; position: absolute; left: 50%; top: -11px; width: 74px; height: 22px;
    transform: translateX(-50%) rotate(3deg);
    background: rgba(244, 154, 176, .55); border-radius: 3px;
  }
  .note small { display: block; margin-top: 8px; font-family: "Fraunces", Georgia, serif; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
  .note.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) rotate(-2deg) scale(1); }

  /* ---------- tap garden ---------- */
  .garden { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .tap-flower { position: absolute; transform: translate(-50%, -50%); }
  .tap-flower > div { width: 100%; height: 100%; }
  .tap-flower svg { width: 100%; height: 100%; display: block; overflow: visible; animation: bob 3.5s ease-in-out infinite alternate; }
  .tap-flower.fade { transition: opacity .8s ease; opacity: 0; }
  .heart-fx { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; }
  .heart-fx svg { width: 100%; height: 100%; display: block; }

  @media (max-height: 640px) {
    h1 { font-size: clamp(42px, 11vh, 64px); }
    .lead-wrap > p { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .petals { display: none; }
    .envelope, .tap-hint, h1 .heart, .ready .bob, .ready #sway, .ready #tagSwing, .tap-flower svg { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="app" id="app">
    <header>
      <p class="eyebrow">special delivery for</p>
      <h1>Clare<span class="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span></h1>
      <div class="lead-wrap">
        <p class="lead-intro">You have one (1) delivery waiting.</p>
        <p class="lead-real">Couldn't get you real flowers today, so I grew you some on the internet. Zero watering, zero wilting, 100% yours.</p>
      </div>
    </header>

    <div class="stage">
      <div class="intro" id="intro">
        <button class="envelope" id="envelope" type="button" aria-label="Open your flower delivery">
          <span class="env-back"></span>
          <span class="letter">for you ♡</span>
          <span class="env-sides"></span>
          <span class="env-bottom"></span>
          <span class="env-flap"></span>
          <span class="seal"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
        </button>
        <p class="contents">contents: flowers &middot; handle with care</p>
        <p class="tap-hint">tap to open</p>
      </div>

      <svg id="bouquet" viewBox="30 50 340 575" preserveAspectRatio="xMidYMax meet" role="img"
           aria-label="A bouquet of tulips, roses, daisies, cosmos, lavender and a sunflower, wrapped in paper with a pink ribbon and a tag that says I love you, from Henry">
        <g id="sway">
          <path id="paperBack" class="rise" d="M200 612 L56 352 Q94 326 132 344 Q166 304 200 326 Q236 300 268 344 Q306 326 344 352 Z" fill="#d9ae7f"/>
          <g id="foliage"></g>
          <g id="stems"></g>
          <g id="heads"></g>
          <g id="paperFront" class="rise">
            <path d="M76 378 Q160 382 236 418 L204 618 Z" fill="#e9c69a"/>
            <path d="M118 396 L196 596" stroke="#d6ab7c" stroke-width="1.4" fill="none" opacity=".6"/>
            <path d="M324 378 Q240 382 164 418 L196 618 Z" fill="#f2d5ae"/>
            <path d="M282 396 L205 596" stroke="#e1bc8e" stroke-width="1.4" fill="none" opacity=".6"/>
            <path d="M324 378 Q240 382 164 418" stroke="#fff3df" stroke-width="2" fill="none" opacity=".7"/>
          </g>
          <g id="ribbon" class="pop">
            <path d="M149 508 Q200 516 251 508 L247 523 Q200 531 153 523 Z" fill="#e4557c"/>
            <path d="M197 521 C190 540 183 556 170 572 L183 575 C192 558 198 541 201 523 Z" fill="#d9436c"/>
            <path d="M203 521 C210 540 219 555 233 568 L221 575 C210 558 204 541 199 523 Z" fill="#d9436c"/>
            <path d="M200 516 C178 492 146 494 153 514 C158 531 184 527 200 516 Z" fill="#ef6f93"/>
            <path d="M200 516 C222 492 254 494 247 514 C242 531 216 527 200 516 Z" fill="#ef6f93"/>
            <path d="M196 514 C182 504 166 503 161 511" stroke="#ffb3c6" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
            <path d="M204 514 C218 504 234 503 239 511" stroke="#ffb3c6" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
            <ellipse cx="200" cy="517" rx="8" ry="9" fill="#d23d66"/>
          </g>
          <g id="tag" class="pop">
            <g id="tagSwing">
              <path d="M204 520 Q236 536 262 540" stroke="#b98a5e" stroke-width="1.2" fill="none"/>
              <g transform="translate(258 532) rotate(10)">
                <path d="M12 0 H96 Q100 0 100 4 V48 Q100 52 96 52 H12 L0 26 Z" fill="#fffaf3" stroke="#ecd9c2" stroke-width="1.2"/>
                <circle cx="11" cy="26" r="3" fill="none" stroke="#c9a77f" stroke-width="1.2"/>
                <text x="56" y="25" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="21" fill="#c2365f">I love you</text>
                <text x="58" y="44" text-anchor="middle" font-family="Caveat, cursive" font-weight="500" font-size="16" fill="#5b2737">&mdash; Henry</text>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div class="bar">
      <button class="note-btn" id="noteBtn" type="button">💌 open a little note</button>
      <p class="meta"><b id="count">0</b> flowers for Clare &middot; tap anywhere to grow more</p>
    </div>
  </main>

  <div class="note" id="note" role="status" aria-live="polite"></div>
  <div class="garden" id="garden" aria-hidden="true"></div>

  <noscript><p style="position:fixed;bottom:12px;left:0;right:0;text-align:center;z-index:9">Turn on JavaScript to open your flowers 💐</p></noscript>

<script>
(() => {
  "use strict";

  const TO = "Clare";
  const FROM = "Henry";

  const NOTES = [
    "Official reminder: you're allowed to take a nap. Doctor " + FROM + "'s orders.",
    "You're doing way better than you think. I'd know, I'm your biggest fan.",
    "Fun fact: you're my favorite person. Okay, that's not a fun fact. It's just a fact.",
    "This bouquet comes with unlimited hugs. Redeemable anytime, no expiration date.",
    "Coupon: one (1) back rub. Valid whenever you want it.",
    "Drink some water. Then text me something cute.",
    "Bad days end. Me being obsessed with you doesn't.",
    "You're cute when you're stressed. Also when you're not. So, always.",
    "If you were a flower, you'd be the one everyone stops to look at.",
    "Rated 10/10 girlfriend by me, the only judge that counts.",
    "Deep breath in... and out. You've got this. And you've got me.",
    "I'd pick you in every lifetime. And in every garden.",
    "Whatever's going on, I'm on your team. Always."
  ];

  const MILESTONES = {
    25: "Okay, that's a lot of flowers.",
    50: "Congrats, you now own a small garden.",
    100: FROM + " is going to need a bigger vase.",
    200: "This is officially a botanical emergency.",
    365: "One for every day I love you. Kidding, you'll need way more."
  };

  /* ---------- helpers ---------- */
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const canAnim = typeof Element.prototype.animate === "function";
  const BACK = "cubic-bezier(.34,1.56,.64,1)";
  const SOFT = "cubic-bezier(.25,.8,.3,1)";
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const HEART = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";

  function anim(node, frames, opts) {
    if (!canAnim || !node) return null;
    const o = Object.assign({ fill: "both", easing: SOFT }, opts);
    if (reduce) { o.duration = 1; o.delay = 0; }
    return node.animate(frames, o);
  }

  function svgEl(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------- flower drawings (each centered on 0,0) ---------- */
  const PAL = {
    rose: { red: ["#c8243f", "#e23d5b", "#f47a8f"], pink: ["#e0688a", "#f497ae", "#fcc6d2"], coral: ["#e35d48", "#f6876f", "#ffbca7"] },
    tulip: { pink: ["#e0578a", "#f78fb3"], orange: ["#ee7438", "#ffa463"], purple: ["#9566d0", "#bf98ee"], yellow: ["#f0b026", "#ffd45e"], red: ["#d93a4a", "#f5687a"] },
    cosmos: { pink: ["#f08ab6", "#fcd0e2"], lilac: ["#b38ded", "#e3d2fb"], white: ["#fff6f8", "#ffffff"] }
  };

  function ring(n, d, fill, extra, offset, scale) {
    let s = "";
    for (let i = 0; i < n; i++) {
      const a = (offset || 0) + (i * 360) / n;
      s += '<g transform="rotate(' + a.toFixed(1) + ")" + (scale ? " scale(" + scale + ")" : "") + '"><path class="p" d="' + d + '" fill="' + fill + '"' + (extra || "") + "/></g>";
    }
    return s;
  }

  const ROSE_PETAL = "M0 0 C-17 -3 -22 -22 -11 -31 C-4 -36 4 -36 11 -31 C22 -22 17 -3 0 0Z";
  const DAISY_PETAL = "M0 -4 C-5.5 -9 -5.5 -26 0 -30 C5.5 -26 5.5 -9 0 -4Z";
  const SUN_PETAL = "M0 -8 C-6 -16 -5.5 -30 0 -39 C5.5 -30 6 -16 0 -8Z";
  const COSMOS_PETAL = "M0 -3 C-10 -8 -13 -23 -9 -32 L-4.5 -29 L0 -33 L4.5 -29 L9 -32 C13 -23 10 -8 0 -3Z";

  const HEADS = {
    rose(c) {
      return ring(5, ROSE_PETAL, c[0], "", 0) +
        ring(5, ROSE_PETAL, c[1], "", 36, 0.72) +
        '<circle class="c" r="10.5" fill="' + c[2] + '"/>' +
        '<path class="c" d="M0 0 m-2 0 a2 2 0 1 1 4 0 a4 4 0 1 1 -8 0 a6 6 0 1 1 12 0 a8.5 8.5 0 1 1 -17 0" fill="none" stroke="' + c[0] + '" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>';
    },
    tulip(c) {
      return '<path class="p" d="M0 6 C-16 6 -23 -10 -19 -38 C-12 -32 -5 -24 0 -12Z" fill="' + c[0] + '"/>' +
        '<path class="p" d="M0 6 C16 6 23 -10 19 -38 C12 -32 5 -24 0 -12Z" fill="' + c[0] + '"/>' +
        '<path class="p" d="M0 8 C-12 8 -15 -12 -9 -30 C-6 -38 -2 -42 0 -44 C2 -42 6 -38 9 -30 C15 -12 12 8 0 8Z" fill="' + c[1] + '"/>' +
        '<path d="M0 4 C-3 -8 -3 -22 0 -34" stroke="' + c[0] + '" stroke-width="1.4" fill="none" opacity=".35"/>';
    },
    daisy() {
      return ring(14, DAISY_PETAL, "#fffaf2", ' stroke="#ecdcc8" stroke-width=".8"', 0) +
        '<circle class="c" r="7.5" fill="#f5c040"/><circle class="c" r="4.2" fill="#e9a32b" opacity=".55"/>';
    },
    sunflower() {
      let seeds = "";
      for (let i = 1; i < 46; i++) {
        const r = 1.75 * Math.sqrt(i), a = i * 2.39996;
        if (r > 12.5) break;
        seeds += '<circle cx="' + (r * Math.cos(a)).toFixed(2) + '" cy="' + (r * Math.sin(a)).toFixed(2) + '" r=".95" fill="#4a2614"/>';
      }
      return ring(18, SUN_PETAL, "#f2a019", "", 10) +
        ring(18, SUN_PETAL, "#ffcb33", "", 0, 0.92) +
        '<g class="c"><circle r="15.5" fill="#6b3b22"/><circle r="12" fill="#86502d"/>' + seeds + "</g>";
    },
    cosmos(c) {
      return ring(8, COSMOS_PETAL, c[0], "", 0) +
        ring(8, COSMOS_PETAL, c[1], ' opacity=".55"', 0, 0.55) +
        '<g class="c"><circle r="5.5" fill="#f6c443"/><circle r="2.6" fill="#e39a22"/></g>';
    },
    lavender() {
      const cols = ["#8e6cc9", "#a184d8", "#7a59b8"];
      let s = '<path d="M0 2 V-54" stroke="#5c9a58" stroke-width="1.6" fill="none"/>';
      for (let i = 0; i < 11; i++) {
        const y = -6 - i * 4.6, side = i % 2 ? 1 : -1, k = 1 - i * 0.045, x = side * 2.7 * k;
        s += '<g transform="rotate(' + side * 22 + " " + x.toFixed(2) + " " + y.toFixed(2) + ')"><ellipse class="dot" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" rx="' + (2.9 * k).toFixed(2) + '" ry="' + (4.3 * k).toFixed(2) + '" fill="' + cols[i % 3] + '"/></g>';
      }
      return s + '<ellipse class="dot" cx="0" cy="-57" rx="2" ry="3.4" fill="#a184d8"/>';
    },
    baby() {
      const tips = [[-17, -12], [-8, -27], [5, -31], [15, -19], [22, -6], [-23, -2], [1, -16]];
      let lines = "", dots = "";
      tips.forEach(([x, y], i) => {
        lines += '<path d="M0 0 Q' + (x * 0.25).toFixed(1) + " " + (y * 0.65).toFixed(1) + " " + x + " " + y + '" stroke="#7da56f" stroke-width="1.1" fill="none"/>';
        [[0, 0, 2.8], [3.2, 2.2, 2.2], [-3, 2.6, 2.1], [1, -3.4, 2]].forEach(([dx, dy, r], j) => {
          if (j === 3 && i % 2) return;
          dots += '<circle class="dot" cx="' + (x + dx) + '" cy="' + (y + dy) + '" r="' + r + '" fill="#ffffff" stroke="#e8e0d4" stroke-width=".6"/>';
        });
      });
      return lines + dots;
    }
  };
  const BOTTOM_ORIGIN = { tulip: 1, lavender: 1, baby: 1 };

  function bloom(head, delay, dur) {
    anim(head, [{ transform: "scale(.15) rotate(-35deg)", opacity: 0 }, { transform: "scale(1) rotate(0deg)", opacity: 1 }],
      { duration: dur, delay: delay, easing: BACK });
    head.querySelectorAll(".p").forEach((p, i) => {
      anim(p, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: dur * 0.85, delay: delay + 40 + (i % 20) * 26, easing: BACK });
    });
    head.querySelectorAll(".dot").forEach((d, i) => {
      anim(d, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: 380, delay: delay + 60 + i * 30, easing: BACK });
    });
    head.querySelectorAll(".c").forEach((c) => {
      anim(c, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: dur * 0.6, delay: delay + dur * 0.45, easing: BACK });
    });
  }

  /* ---------- bouquet layout (viewBox units) ---------- */
  const BOUQUET = [
    { t: "lavender", x: 60, y: 210 },
    { t: "lavender", x: 342, y: 218 },
    { t: "lavender", x: 88, y: 168 },
    { t: "lavender", x: 314, y: 172 },
    { t: "baby", x: 128, y: 100 },
    { t: "baby", x: 276, y: 94 },
    { t: "baby", x: 214, y: 70 },
    { t: "tulip", c: PAL.tulip.pink, x: 104, y: 178, s: 1.15 },
    { t: "tulip", c: PAL.tulip.orange, x: 300, y: 170, s: 1.15 },
    { t: "sunflower", x: 168, y: 124, s: 1.18 },
    { t: "rose", c: PAL.rose.red, x: 248, y: 140, s: 1.12 },
    { t: "cosmos", c: PAL.cosmos.lilac, x: 284, y: 238 },
    { t: "daisy", x: 122, y: 248, s: 1.05 },
    { t: "tulip", c: PAL.tulip.purple, x: 66, y: 288 },
    { t: "tulip", c: PAL.tulip.yellow, x: 336, y: 292 },
    { t: "rose", c: PAL.rose.pink, x: 202, y: 214, s: 1.22 },
    { t: "rose", c: PAL.rose.coral, x: 118, y: 330 },
    { t: "cosmos", c: PAL.cosmos.pink, x: 284, y: 332 },
    { t: "daisy", x: 204, y: 320, s: 0.98 }
  ];
  const FOLIAGE = [
    { x: 150, y: 384, r: -126, s: 1.75 }, { x: 252, y: 384, r: -54, s: 1.75 },
    { x: 128, y: 388, r: -160, s: 1.45 }, { x: 272, y: 388, r: -20, s: 1.45 },
    { x: 186, y: 384, r: -102, s: 1.5 }, { x: 216, y: 384, r: -76, s: 1.35 },
    { x: 104, y: 380, r: -176, s: 1.2 }, { x: 296, y: 380, r: -4, s: 1.2 }
  ];
  const LEAF = "M0 0 C8 -10 24 -11 36 -2 C24 7 8 7 0 0Z";
  const LEAF_VEIN = "M3 -.5 C14 -2.5 24 -2.5 33 -2";
  const STEM_COLORS = ["#4f8f4d", "#5b9c57", "#468449", "#64a35f"];
  const LEAF_COLORS = ["#6aa865", "#5a9a58", "#7cb874", "#5f9f5b"];

  function leafMarkup(fill) {
    return '<path d="' + LEAF + '" fill="' + fill + '"/><path d="' + LEAF_VEIN + '" stroke="#3f7a3f" stroke-width=".9" fill="none" opacity=".45"/>';
  }

  let built = false;
  function buildBouquet() {
    if (built) return;
    built = true;
    const stems = $("stems"), heads = $("heads"), foliage = $("foliage");

    FOLIAGE.forEach((f, i) => {
      const g = svgEl("g", { transform: "translate(" + f.x + " " + f.y + ") rotate(" + f.r + ") scale(" + f.s + ")" }, foliage);
      const leaf = svgEl("g", { class: "leaf" }, g);
      leaf.innerHTML = leafMarkup(LEAF_COLORS[i % LEAF_COLORS.length]);
      anim(leaf, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: 700, delay: 500 + i * 70, easing: BACK });
    });

    // grow order: closest to the middle of the bouquet first
    const order = BOUQUET.map((f, i) => ({ i, d: Math.hypot(f.x - 200, (f.y - 230) * 0.8) }))
      .sort((a, b) => a.d - b.d).map((o) => o.i);
    const rank = {};
    order.forEach((idx, r) => { rank[idx] = r; });

    let lastEnd = 0;
    BOUQUET.forEach((f, i) => {
      const o = (f.x - 200) * 0.05;
      const sx = 200 + o, sy = 588;
      const cx = 200 + (f.x - 200) * 0.12 + o, cy = f.y + (sy - f.y) * 0.55;
      const filler = f.t === "lavender" || f.t === "baby";
      const stem = svgEl("path", {
        d: "M" + sx.toFixed(1) + " " + sy + " Q" + cx.toFixed(1) + " " + cy.toFixed(1) + " " + f.x + " " + f.y,
        stroke: STEM_COLORS[i % STEM_COLORS.length], "stroke-width": filler ? 2 : 3.2,
        "stroke-linecap": "round", fill: "none"
      }, stems);

      const len = stem.getTotalLength();
      const delay = 400 + rank[i] * 105;
      const dur = Math.max(850, len * 2.6);
      stem.style.strokeDasharray = len + " " + len;
      anim(stem, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, delay: delay, easing: "cubic-bezier(.35,.1,.25,1)" });

      // leaves on main flower stems, only where the stem is above the paper
      if (!filler) {
        [0.5, 0.66].forEach((frac, k) => {
          if (k === 1 && i % 3 === 0) return;
          const pt = stem.getPointAtLength(len * frac);
          if (pt.y > 372 || pt.y < f.y + 26) return;
          const p2 = stem.getPointAtLength(Math.min(len, len * frac + 2));
          const tan = Math.atan2(p2.y - pt.y, p2.x - pt.x) * 180 / Math.PI;
          const side = (i + k) % 2 ? 1 : -1;
          const g = svgEl("g", { transform: "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ") rotate(" + (tan + side * 52).toFixed(1) + ") scale(.85 " + (side * 0.85) + ")" }, stems);
          const leaf = svgEl("g", { class: "leaf" }, g);
          leaf.innerHTML = leafMarkup(LEAF_COLORS[(i + k) % LEAF_COLORS.length]);
          anim(leaf, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: 650, delay: delay + dur * frac + 80, easing: BACK });
        });
      }

      // head, oriented along the stem for tulips & fillers
      const end = stem.getPointAtLength(len), before = stem.getPointAtLength(Math.max(0, len - 6));
      const tanEnd = Math.atan2(end.y - before.y, end.x - before.x) * 180 / Math.PI;
      const rot = BOTTOM_ORIGIN[f.t] ? tanEnd + 90 : rand(0, 360);
      const outer = svgEl("g", { transform: "translate(" + f.x + " " + f.y + ") rotate(" + rot.toFixed(1) + ") scale(" + (f.s || 1) + ")" }, heads);
      const bob = svgEl("g", { class: "bob" }, outer);
      bob.style.setProperty("--bd", rand(3.2, 5.2).toFixed(2) + "s");
      bob.style.setProperty("--bdel", (-rand(0, 5)).toFixed(2) + "s");
      const head = svgEl("g", { class: "hd" + (BOTTOM_ORIGIN[f.t] ? " bot" : "") }, bob);
      head.innerHTML = HEADS[f.t](f.c);
      const bloomAt = delay + dur * 0.9;
      bloom(head, bloomAt, filler ? 520 : 760);
      lastEnd = Math.max(lastEnd, bloomAt + 900);
    });

    anim($("paperBack"), [{ transform: "translateY(26px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 650, delay: 80 });
    anim($("paperFront"), [{ transform: "translateY(26px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 650, delay: 180 });
    anim($("ribbon"), [{ transform: "scale(0) rotate(-20deg)" }, { transform: "scale(1) rotate(0deg)" }], { duration: 700, delay: 700, easing: BACK });
    anim($("tag"), [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 600, delay: lastEnd - 300, easing: BACK });
    anim($("tagSwing"), [{ transform: "rotate(-28deg)" }, { transform: "rotate(10deg)", offset: 0.45 }, { transform: "rotate(-5deg)", offset: 0.75 }, { transform: "rotate(0deg)" }],
      { duration: 1400, delay: lastEnd - 300, easing: "ease-out", fill: "backwards" });

    return reduce ? 50 : lastEnd + 400;
  }

  /* ---------- falling petals ---------- */
  function makePetals() {
    if (reduce) return;
    const box = $("petals");
    const colors = ["#f7a8bd", "#fbc6d3", "#f48fab", "#ffd1b8", "#fde2ea", "#e9a6e0"];
    const n = window.innerWidth < 600 ? 14 : 22;
    for (let i = 0; i < n; i++) {
      const p = document.createElement("i");
      p.className = "petal";
      const d = rand(10, 18);
      p.style.left = rand(-2, 100).toFixed(1) + "vw";
      p.style.setProperty("--d", d.toFixed(1) + "s");
      p.style.setProperty("--delay", (-rand(0, d)).toFixed(1) + "s");
      p.style.setProperty("--sway", rand(18, 55).toFixed(0) + "px");
      p.style.setProperty("--s", rand(0.6, 1.25).toFixed(2));
      p.style.setProperty("--c", pick(colors));
      p.appendChild(document.createElement("b"));
      box.appendChild(p);
    }
  }

  /* ---------- hearts + tap-to-grow ---------- */
  const garden = $("garden");
  const HEART_COLORS = ["#e4557c", "#f28cab", "#ff7a9c", "#d9345f", "#f7a8bd"];

  function hearts(x, y, n, spread) {
    for (let i = 0; i < n; i++) {
      const h = document.createElement("div");
      h.className = "heart-fx";
      h.style.left = x + "px";
      h.style.top = y + "px";
      h.innerHTML = '<svg viewBox="0 0 24 24"><path fill="' + pick(HEART_COLORS) + '" d="' + HEART + '"/></svg>';
      garden.appendChild(h);
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05);
      const dist = rand(30, spread || 70);
      const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist - rand(10, 40);
      const s = rand(0.7, 1.4);
      const run = anim(h, [
        { transform: "translate(0,0) scale(.3)", opacity: 0 },
        { transform: "translate(" + dx * 0.5 + "px," + dy * 0.5 + "px) scale(" + s + ")", opacity: 1, offset: 0.35 },
        { transform: "translate(" + dx + "px," + (dy - 30) + "px) scale(" + s * 0.8 + ") rotate(" + rand(-30, 30) + "deg)", opacity: 0 }
      ], { duration: rand(900, 1500), easing: "ease-out" });
      if (run) run.onfinish = () => h.remove(); else setTimeout(() => h.remove(), 50);
    }
  }

  const TAP_TYPES = ["rose", "daisy", "tulip", "cosmos", "sunflower", "rose", "tulip", "cosmos"];
  function colorFor(type) {
    if (type === "rose") return pick(Object.values(PAL.rose));
    if (type === "tulip") return pick(Object.values(PAL.tulip));
    if (type === "cosmos") return pick(Object.values(PAL.cosmos).slice(0, 2));
    return null;
  }

  const planted = [];
  let count = 0;
  const countEl = $("count");

  function setCount(n) {
    count = n;
    countEl.textContent = n;
    if (MILESTONES[n]) showNote(MILESTONES[n], "milestone unlocked");
  }

  function growAt(x, y) {
    const type = pick(TAP_TYPES);
    const size = rand(46, 74);
    const wrap = document.createElement("div");
    wrap.className = "tap-flower";
    wrap.style.left = x + "px";
    wrap.style.top = y + "px";
    wrap.style.width = wrap.style.height = size.toFixed(0) + "px";
    const shift = type === "tulip" ? 18 : 0;
    const rot = type === "tulip" ? rand(-18, 18) : rand(0, 360);
    wrap.innerHTML = '<div><svg viewBox="-42 -42 84 84" style="animation-duration:' + rand(2.8, 4.4).toFixed(2) + 's;animation-delay:-' + rand(0, 3).toFixed(2) + 's"><g transform="translate(0 ' + shift + ") rotate(" + rot.toFixed(0) + ')"><g class="hd' + (BOTTOM_ORIGIN[type] ? " bot" : "") + '">' + HEADS[type](colorFor(type)) + "</g></g></svg></div>";
    garden.appendChild(wrap);
    anim(wrap.firstChild, [
      { transform: "scale(0) rotate(-90deg)" },
      { transform: "scale(1.15) rotate(6deg)", offset: 0.7 },
      { transform: "scale(1) rotate(0deg)" }
    ], { duration: 620 });
    bloom(wrap.querySelector(".hd"), 0, 520);
    hearts(x, y, 5, 60);

    planted.push(wrap);
    if (planted.length > 70) {
      const old = planted.shift();
      old.classList.add("fade");
      setTimeout(() => old.remove(), 900);
    }
    setCount(count + 1);
  }

  /* ---------- notes ---------- */
  const noteEl = $("note"), noteBtn = $("noteBtn");
  let deck = [], noteTimer = 0;
  function nextNote() {
    if (!deck.length) {
      deck = NOTES.slice();
      for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    }
    return deck.pop();
  }
  function showNote(text, label) {
    clearTimeout(noteTimer);
    noteEl.classList.remove("show");
    void noteEl.offsetWidth;
    noteEl.innerHTML = "";
    noteEl.appendChild(document.createTextNode(text));
    const small = document.createElement("small");
    small.textContent = label || "tap to close";
    noteEl.appendChild(small);
    noteEl.classList.add("show");
    noteTimer = setTimeout(() => noteEl.classList.remove("show"), 9000);
  }
  noteBtn.addEventListener("click", () => {
    showNote(nextNote(), "with love, " + FROM);
    noteBtn.textContent = "💌 another one";
    const r = noteBtn.getBoundingClientRect();
    hearts(r.left + r.width / 2, r.top, 4, 50);
  });
  noteEl.addEventListener("click", () => { clearTimeout(noteTimer); noteEl.classList.remove("show"); });

  /* ---------- open sequence ---------- */
  const app = $("app"), envelope = $("envelope"), intro = $("intro"), bouquet = $("bouquet");
  let ready = false;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));

  envelope.addEventListener("click", async () => {
    if (envelope.classList.contains("open")) return;
    envelope.classList.add("open");
    await wait(520);
    envelope.classList.add("flap-back", "lift");
    await wait(750);
    const r = envelope.getBoundingClientRect();
    hearts(r.left + r.width / 2, r.top + r.height * 0.3, 16, 140);
    envelope.classList.add("leaving");
    intro.classList.add("gone");
    app.classList.add("opened");
    await wait(450);
    intro.hidden = true;
    bouquet.classList.add("on");
    const total = buildBouquet();
    await wait(total);
    app.classList.add("ready");
    ready = true;
    setCount(BOUQUET.filter((f) => f.t !== "lavender" && f.t !== "baby").length);
  });

  document.addEventListener("pointerdown", (e) => {
    if (!ready) return;
    if (e.target.closest && e.target.closest("button, .note")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    growAt(e.clientX, e.clientY);
  });

  makePetals();
})();
</script>
</body>
</html>
