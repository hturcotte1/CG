<style>

  .ui { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .title {
    position: absolute; left: 0; right: 0; top: 50%;

  .started .title { top: calc(env(safe-area-inset-top) + 28px); transform: none; }
  .for {
    margin: 0; padding-left: .45em;
    font-size: 11px; letter-spacing: .45em; text-transform: uppercase; color: var(--muted);

  }

    margin: 4px 0 0; font-weight: 300; font-style: italic;
    font-size: clamp(52px, 14vw, 80px); line-height: 1.05; letter-spacing: -.015em;

  .line {
    margin: 14px auto 0; max-width: 22em;
    font-size: clamp(15px, 4.1vw, 17.5px); line-height: 1.55; color: var(--soft);

    transition: opacity 1.6s ease, transform 1.6s var(--ease);
  }
  .line + .line { margin-top: 6px; font-style: italic; }
  .line.show { opacity: 1; transform: none; }
  .begin {
    position: absolute; left: 0; right: 0; top: calc(50% + 62px); margin: 0;
    text-align: center; padding-left: .4em;
    font-size: 10.5px; letter-spacing: .4em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: rise 1.6s 1.3s var(--ease) forwards, breathe 3.2s 3s ease-in-out infinite;
  }
  .started .begin { animation: none; opacity: 0; transition: opacity .6s ease; }
  .hint {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 20px); margin: 0;
    text-align: center; padding: 0 16px 0 calc(16px + .3em);
    font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
    opacity: 0; transition: opacity 1.8s ease;

  .ps {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 42px); margin: 0;

    transition: opacity 2s ease, transform 2s var(--ease);

  @media (max-height: 560px) {

  }

<script type="module">
import * as THREE from "./vendor/three.module.min.js";

const FALLBACK = "garden.html";   // the 2D garden, for phones without WebGL

/* ================================================================ helpers */
const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const $ = (id) => document.getElementById(id);
const docEl = document.documentElement;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = (u) => {
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  const s = u * u * (3 - 2 * u) - 1;
  return 1 + 2.2 * s * s * s + 1.2 * s * s;
};
const UP = new THREE.Vector3(0, 1, 0);

/* ================================================================ renderer */
const canvas = $("scene");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
} catch (e) {
  location.replace(FALLBACK);
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffe4ee, 0x231424, 0.7));
const key = new THREE.DirectionalLight(0xfff0e6, 2.0); key.position.set(-3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xff9cc2, 2.2); rim.position.set(3, 3, -6); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xb6a2ff, 1.3); rim2.position.set(-5, 0.5, -3); scene.add(rim2);
const fill = new THREE.PointLight(0xffd6c6, 10, 30, 2); fill.position.set(0, -1.5, 6); scene.add(fill);

const bouquet = new THREE.Group();
bouquet.rotation.order = "XYZ";
scene.add(bouquet);

/* ================================================================ textures */
function canvasTex(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = canvasTex(128, (g, s) => {
  const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.25, "rgba(255,255,255,.42)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const ringTex = canvasTex(256, (g, s) => {
  const r = g.createRadialGradient(s / 2, s / 2, s * 0.36, s / 2, s / 2, s / 2);
  r.addColorStop(0, "rgba(255,255,255,0)"); r.addColorStop(0.55, "rgba(255,255,255,.9)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const dotTex = canvasTex(64, (g, s) => {
  const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.3, "rgba(255,255,255,.5)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const centerTex = {
  anemone: canvasTex(256, (g, s) => {
    const c = s / 2;
    g.fillStyle = "#2a1a2e"; g.fillRect(0, 0, s, s);
    g.strokeStyle = "rgba(20,10,22,.9)"; g.lineWidth = 2;
    for (let i = 0; i < 40; i++) { const a = (i / 40) * TAU; g.beginPath(); g.moveTo(c + Math.cos(a) * s * 0.26, c + Math.sin(a) * s * 0.26); g.lineTo(c + Math.cos(a) * s * 0.42, c + Math.sin(a) * s * 0.42); g.stroke(); }
    for (let i = 0; i < 40; i++) {
      const a = (i / 40) * TAU + (i % 2) * 0.05, r = s * (0.4 + (i % 3) * 0.03);
      g.fillStyle = "#120914"; g.beginPath(); g.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, s * 0.028, 0, TAU); g.fill();
      g.fillStyle = "rgba(160,120,170,.35)"; g.beginPath(); g.arc(c + Math.cos(a) * r - 1.5, c + Math.sin(a) * r - 1.5, s * 0.01, 0, TAU); g.fill();
    }
    const rg = g.createRadialGradient(c - 8, c - 8, 0, c, c, s * 0.27);
    rg.addColorStop(0, "#6a4a78"); rg.addColorStop(0.6, "#2b1630"); rg.addColorStop(1, "#140a16");
    g.fillStyle = rg; g.beginPath(); g.arc(c, c, s * 0.27, 0, TAU); g.fill();
  }),
  cosmos: canvasTex(128, (g, s) => {
    const c = s / 2, rg = g.createRadialGradient(c, c, 0, c, c, s / 2);
    rg.addColorStop(0, "#ffe27a"); rg.addColorStop(1, "#e49a2c");
    g.fillStyle = rg; g.fillRect(0, 0, s, s);
    g.fillStyle = "rgba(170,95,20,.75)";
    for (let i = 1; i < 60; i++) { const r = 5.2 * Math.sqrt(i), a = i * 2.39996; if (r > s * 0.46) break; g.beginPath(); g.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, 2.2, 0, TAU); g.fill(); }
  }),
  daisy: canvasTex(256, (g, s) => {
    const c = s / 2, rg = g.createRadialGradient(c - 10, c - 10, 0, c, c, s / 2);
    rg.addColorStop(0, "#ffe68a"); rg.addColorStop(0.7, "#f2b236"); rg.addColorStop(1, "#d68a20");
    g.fillStyle = rg; g.fillRect(0, 0, s, s);
    g.fillStyle = "rgba(150,85,15,.5)";
    for (let i = 1; i < 260; i++) { const r = 7.6 * Math.sqrt(i), a = i * 2.39996; if (r > s * 0.47) break; g.beginPath(); g.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, 2.6, 0, TAU); g.fill(); }
  })
};

/* ================================================================ palettes + flower types */
const PAL = {
  blush:  ["#c9567a", "#f6b3c6"],
  peach:  ["#dc7346", "#fbc4a2"],
  cream:  ["#c9b3a3", "#f5ebe1"],
  coral:  ["#bb2340", "#f0727c"],
  lilac:  ["#7a5fc4", "#cbb6f4"],
  butter: ["#d69a20", "#f6da86"],
  white:  ["#d3cbc3", "#faf7f4"]
};

const TYPES = {
  rose: {
    m: 0.6, b: 0.5, ruffle: 0.025, sepals: true,
    layers: [
      { n: 5, L: 1.0,  W: 1.05, bud: 10, open: 92, curl: 0.5,   cup: 0.35, bs: 0.62, d: 0,    sh: 1 },
      { n: 5, L: 0.86, W: 1.0,  bud: 7,  open: 68, curl: 0.25,  cup: 0.45, bs: 0.36, d: 0.14, sh: 0.96 },
      { n: 5, L: 0.72, W: 0.95, bud: 5,  open: 46, curl: 0.05,  cup: 0.55, bs: 0.22, d: 0.28, sh: 0.92 },
      { n: 4, L: 0.56, W: 0.9,  bud: 3,  open: 28, curl: -0.1,  cup: 0.6,  bs: 0.14, d: 0.4,  sh: 0.88 },
      { n: 3, L: 0.4,  W: 0.9,  bud: 2,  open: 12, curl: -0.15, cup: 0.5,  bs: 0.1,  d: 0.5,  sh: 0.84 }
    ]
  },
  anemone: {
    m: 0.62, b: 0.42, ruffle: 0.02, sepals: false, center: "anemone", cr: 0.27, ch: 0.07,
    layers: [
      { n: 6, L: 1.0, W: 1.0,  bud: 10, open: 80, curl: 0.18, cup: 0.3,  bs: 0.6,  d: 0,    sh: 1 },
      { n: 5, L: 0.8, W: 0.92, bud: 6,  open: 62, curl: 0.08, cup: 0.38, bs: 0.35, d: 0.12, sh: 0.95 }
    ]
  },
  cosmos: {
    m: 0.78, b: 0.32, ruffle: 0.015, sepals: true, center: "cosmos", cr: 0.15, ch: 0.06,
    layers: [{ n: 8, L: 1.0, W: 0.62, bud: 8, open: 82, curl: 0.16, cup: 0.12, bs: 0.55, d: 0, sh: 1 }]
  },
  daisy: {
    m: 0.5, b: 0.7, ruffle: 0, sepals: true, center: "daisy", cr: 0.22, ch: 0.1,
    layers: [
      { n: 14, L: 1.0,  W: 0.24, bud: 6, open: 84, curl: 0.2,  cup: 0.08, bs: 0.5, d: 0,    sh: 1 },
      { n: 11, L: 0.84, W: 0.22, bud: 5, open: 72, curl: 0.12, cup: 0.08, bs: 0.4, d: 0.08, sh: 0.94 }
    ]
  },
  tulip: {
    m: 0.5, b: 0.78, ruffle: 0, sepals: false,
    layers: [
      { n: 3, L: 1.25, W: 0.85, bud: 5, open: 30, curl: 0.5, cup: 0.6, bs: 0.72, d: 0,    sh: 1 },
      { n: 3, L: 1.2,  W: 0.8,  bud: 3, open: 22, curl: 0.4, cup: 0.6, bs: 0.7,  d: 0.05, sh: 0.93, off: Math.PI / 3 }
    ]
  }
};
Object.values(TYPES).forEach((T) => { T.maxD = Math.max.apply(null, T.layers.map((l) => l.d)); });
const SEPAL = { L: 0.42, bud: 12, open: 116, bs: 0.75 };

/* ================================================================ geometry builders */
function buildPetal(o) {
  const g = new THREE.PlaneGeometry(1, 1, 6, 10);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const a = Math.log(0.5) / Math.log(o.m);
  const c0 = new THREE.Color(o.c0), c1 = new THREE.Color(o.c1), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i);
    const v0 = pos.getY(i) + 0.5;
    const v = 1 - Math.pow(1 - v0, 1.5);                       // more rows near the tip
    const w = v <= 0 || v >= 1 ? 0 : Math.pow(Math.sin(Math.PI * Math.pow(v, a)), o.b);
    const hw = 0.5 * o.W * o.L * w;
    let z = -o.cup * 4 * u * u * hw;                            // edges lift toward the flower's middle
    z += o.curl * v * v * o.L * 0.5;                            // tips roll back
    z += o.ruffle * o.L * Math.sin(u * 11 + v * 7) * w;         // a little life in the edges
    pos.setXYZ(i, 2 * u * hw, v * o.L - Math.abs(o.curl) * v * v * o.L * 0.12, z);
    c.copy(c0).lerp(c1, Math.pow(v, 0.85));
    const shade = (0.7 + 0.3 * smooth(0, 0.35, v)) * (1 - 0.4 * u * u) * (o.sh || 1);
    col[i * 3] = c.r * shade; col[i * 3 + 1] = c.g * shade; col[i * 3 + 2] = c.b * shade;
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

const geoCache = {};
function petalGeo(type, li, palName) {
  const k = type + ":" + li + ":" + palName;
  if (geoCache[k]) return geoCache[k];
  const T = TYPES[type], ly = T.layers[li], P = PAL[palName];
  return (geoCache[k] = buildPetal({ L: ly.L, W: ly.W, m: T.m, b: T.b, cup: ly.cup, curl: ly.curl, ruffle: T.ruffle, c0: P[0], c1: P[1], sh: ly.sh }));
}
const sepalGeo = buildPetal({ L: SEPAL.L, W: 0.42, m: 0.35, b: 0.9, cup: 0.2, curl: 0.3, ruffle: 0, c0: "#2c5435", c1: "#6f9f77" });

function buildLeaf(len, wid, fold, droop) {
  const g = new THREE.PlaneGeometry(1, 1, 4, 12);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c0 = new THREE.Color("#244a2e"), c1 = new THREE.Color("#79a97f"), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i), v = pos.getY(i) + 0.5;
    const w = v <= 0 || v >= 1 ? 0 : Math.pow(Math.sin(Math.PI * Math.pow(v, 0.8)), 0.9);
    const hw = 0.5 * wid * w;
    const z = -fold * Math.abs(2 * u) * hw + droop * v * v * len * 0.6;
    pos.setXYZ(i, 2 * u * hw, v * len * (1 - droop * v * 0.12), z);
    c.copy(c0).lerp(c1, Math.pow(v, 0.7));
    const k = 0.85 + 0.15 * (1 - Math.abs(2 * u));
    col[i * 3] = c.r * k; col[i * 3 + 1] = c.g * k; col[i * 3 + 2] = c.b * k;
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

function domeGeo(r, h, rings = 6, segs = 28) {
  const P = [0, h, 0], U = [0.5, 0.5], I = [];
  for (let i = 1; i <= rings; i++) {
    const f = i / rings, rr = r * f, y = h * (1 - f * f);
    for (let j = 0; j < segs; j++) {
      const a = (j / segs) * TAU;
      P.push(Math.cos(a) * rr, y, Math.sin(a) * rr);
      U.push(0.5 + Math.cos(a) * 0.5 * f, 0.5 + Math.sin(a) * 0.5 * f);
    }
  }
  for (let j = 0; j < segs; j++) I.push(0, 1 + ((j + 1) % segs), 1 + j);
  for (let i = 1; i < rings; i++) {
    const a0 = 1 + (i - 1) * segs, a1 = 1 + i * segs;
    for (let j = 0; j < segs; j++) {
      const j1 = (j + 1) % segs;
      I.push(a0 + j, a0 + j1, a1 + j, a0 + j1, a1 + j1, a1 + j);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(U, 2));
  g.setIndex(I);
  g.computeVertexNormals();
  return g;
}

/* ================================================================ materials */
// petals: vertex colours + velvet sheen, with a saturation dial so buds start grey and colour floods in
function makePetalMat(tip) {
  const m = new THREE.MeshPhysicalMaterial({
    vertexColors: true, side: THREE.DoubleSide, roughness: 0.6, metalness: 0,
    sheen: 0.35, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xffffff),
    emissive: new THREE.Color(tip), emissiveIntensity: 0
  });
  const uSat = { value: 1 };
  m.userData.uSat = uSat;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uSat = uSat;
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nuniform float uSat;")
      .replace("#include <color_fragment>", "#include <color_fragment>\n  diffuseColor.rgb = mix(vec3(dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114))), diffuseColor.rgb, uSat);");
  };
  m.customProgramCacheKey = () => "petal-sat";
  return m;
}
const sepalMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.7 });
const leafMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55 });
const stemMat = new THREE.MeshStandardMaterial({ color: 0x4f7d57, roughness: 0.6 });
const additive = (color, opacity = 0) => new THREE.SpriteMaterial({
  map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
});

/* ================================================================ the bouquet layout */
const DOME_C = new THREE.Vector3(0, 0.3, 0), DOME_R = 1.35, TIE_Y = -1.0, BOTTOM_Y = -2.35;
const SPECS = [
  { type: "rose",    pal: "blush",  pol: 0,  az: 0,   s: 0.72 },
  { type: "anemone", pal: "cream",  pol: 33, az: 15,  s: 0.62 },

  { type: "rose",    pal: "coral",  pol: 33, az: 255, s: 0.59 },
  { type: "daisy",   pal: "white",  pol: 33, az: 315, s: 0.59 },

const dirFrom = (pol, az, v = new THREE.Vector3()) =>
  v.set(Math.sin(pol * DEG) * Math.sin(az * DEG), Math.cos(pol * DEG), Math.sin(pol * DEG) * Math.cos(az * DEG));

const STEM_SEG = 72, STEM_RAD = 5;
const flowers = [], pickables = [];

function makeFlower(spec) {
  const T = TYPES[spec.type];
  const pol = spec.pol + (spec.pol ? rand(-3, 3) : 0), az = spec.az + rand(-5, 5);
  const dir = dirFrom(pol, az);
  const head = DOME_C.clone().addScaledVector(dir, DOME_R + rand(-0.05, 0.05));
  const axis = spec.type === "tulip" ? dir.clone().lerp(UP, 0.5).normalize() : dir.clone();

  const azr = az * DEG;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(Math.sin(azr + 2.6) * 0.2, BOTTOM_Y + rand(-0.08, 0.08), Math.cos(azr + 2.6) * 0.2),
    new THREE.Vector3(Math.sin(azr) * 0.035, TIE_Y, Math.cos(azr) * 0.035),
    new THREE.Vector3(head.x * 0.32, lerp(TIE_Y, head.y, 0.5), head.z * 0.32),
    head
  ], false, "centripetal");
  const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, STEM_SEG, 0.021, STEM_RAD, false), stemMat);
  stem.geometry.setDrawRange(0, 0);
  bouquet.add(stem);

  const f = {
    spec, T, type: spec.type, s: spec.s, curve, stem, head, axis,
    qFinal: new THREE.Quaternion().setFromUnitVectors(UP, axis).multiply(new THREE.Quaternion().setFromAxisAngle(UP, rand(0, TAU))),
    q: T.layers.map(() => 0), petals: [], mat: makePetalMat(PAL[spec.pal][1]),
    tw: Math.random() < 0.5 ? 1 : -1, ph: rand(0, TAU),
    sx: 0, sz: 0, vx: 0, vz: 0, flutterAt: 0, flashAt: 0, flashed: false, sparkAcc: 0,
    born: Infinity, growDur: 2600, bloomDur: 2100, g: 0
  };
  f.root = new THREE.Group(); f.root.visible = false;
  f.bob = new THREE.Group(); f.root.add(f.bob);
  bouquet.add(f.root);

  const rot = rand(0, TAU);
  const addPetal = (geo, mat, li, phi, ly) => {
    const pivot = new THREE.Object3D(), tilt = new THREE.Object3D(), mesh = new THREE.Mesh(geo, mat);
    tilt.position.set(0, Math.max(0, li) * 0.012, 0.03);
    tilt.add(mesh); pivot.add(tilt); f.bob.add(pivot);
    mesh.userData.f = f;
    f.petals.push({ pivot, tilt, mesh, li, phi, ly, Lj: rand(0.94, 1.06) });
    pickables.push(mesh);
  };
  if (T.sepals) for (let k = 0; k < 5; k++) addPetal(sepalGeo, sepalMat, -1, rot + 0.35 + (k * TAU) / 5, SEPAL);
  T.layers.forEach((ly, li) => {
    const geo = petalGeo(spec.type, li, spec.pal);
    const off = ly.off != null ? ly.off : li * 0.63;
    for (let k = 0; k < ly.n; k++) addPetal(geo, f.mat, li, rot + off + (k * TAU) / ly.n + rand(-0.09, 0.09), ly);
  });
  if (T.center) {
    f.center = new THREE.Mesh(domeGeo(T.cr, T.ch), new THREE.MeshStandardMaterial({ map: centerTex[T.center], roughness: 0.85 }));
    f.center.position.y = 0.035;
    f.center.scale.setScalar(0.0001);
    f.center.userData.f = f;
    f.bob.add(f.center);
    pickables.push(f.center);
  }
  const tip = new THREE.Color(PAL[spec.pal][1]);
  f.glow = new THREE.Sprite(additive(tip)); f.glow.position.y = 0.15; f.glow.scale.setScalar(3); f.root.add(f.glow);
  f.ring = new THREE.Sprite(additive(tip)); f.ring.material.map = ringTex; f.ring.position.y = 0.15; f.root.add(f.ring);
  f.spark = new THREE.Sprite(additive(new THREE.Color(0xfff1e0))); f.spark.scale.setScalar(0.42); bouquet.add(f.spark);
  flowers.push(f);
  return f;
}
SPECS.forEach(makeFlower);

/* leaves: a collar under the flowers plus a few tucked between them */
const leaves = [];
function addLeaf(pol, az, outPol, len, wid, fold, droop, delay, rOff) {
  const anchor = DOME_C.clone().addScaledVector(dirFrom(pol, az), DOME_R * rOff);
  const Y = dirFrom(outPol, az);
  const down = new THREE.Vector3(0, -1, 0);
  const Z = down.addScaledVector(Y, -down.dot(Y)).normalize();
  const X = new THREE.Vector3().crossVectors(Y, Z);
  const g = new THREE.Group();
  g.position.copy(anchor);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
  const inner = new THREE.Group();
  const mesh = new THREE.Mesh(buildLeaf(len, wid, fold, droop), leafMat);
  inner.add(mesh); g.add(inner);
  inner.scale.setScalar(0.0001);
  bouquet.add(g);
  leaves.push({ inner, delay });
}
for (let i = 0; i < 9; i++) addLeaf(84, i * 40 + 10 + rand(-6, 6), 100 + rand(-6, 8), rand(1.0, 1.25), rand(0.32, 0.4), 0.35, 0.45, 2700 + i * 90, 0.72);
for (let i = 0; i < 7; i++) addLeaf(70, i * 51 + 25 + rand(-6, 6), 78 + rand(-5, 5), rand(0.62, 0.78), rand(0.24, 0.3), 0.35, 0.3, 3300 + i * 90, 0.86);

/* baby's breath */
const BB_SPRIGS = [], BB_PER = 16;
for (let i = 0; i < 6; i++) BB_SPRIGS.push({ pol: 48, az: i * 60 + 45 });
for (let i = 0; i < 6; i++) BB_SPRIGS.push({ pol: 76, az: i * 60 + 18 });
const bbMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.024, 8, 6),
  new THREE.MeshStandardMaterial({ color: 0xfffaf4, roughness: 0.55, emissive: 0x2a2026 }), BB_SPRIGS.length * BB_PER);
const bbDots = [];
BB_SPRIGS.forEach((sp, si) => {
  const d = dirFrom(sp.pol + rand(-3, 3), sp.az + rand(-5, 5));
  const c = DOME_C.clone().addScaledVector(d, DOME_R + 0.16);
  for (let k = 0; k < BB_PER; k++) {
    const p = c.clone().add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(0, 0.15))).addScaledVector(d, rand(-0.05, 0.08));
    bbDots.push({ p, s: rand(0.7, 1.35), delay: si * 110 + k * 22 });
  }
});
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
function setBB(i, sc) {
  tmpS.setScalar(Math.max(sc, 0.0001));
  tmpM.compose(bbDots[i].p, tmpQ.identity(), tmpS);
  bbMesh.setMatrixAt(i, tmpM);
}
bbDots.forEach((_, i) => setBB(i, 0));
bouquet.add(bbMesh);

/* ribbon tied around the stems */

const band = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.15, 40, 1, true), ribbonMat);
ribbon.add(band);
const bow = new THREE.Group(); bow.position.set(0, 0.0, 0.12); ribbon.add(bow);

  tailG.computeVertexNormals();
  const tail = new THREE.Mesh(tailG, ribbonMat);
  tail.position.set(sgn * 0.04, -0.3, 0.01);
  tail.rotation.z = sgn * 0.12;
  bow.add(tail);

const knot = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), ribbonMat);
knot.scale.set(1, 0.85, 0.7); bow.add(knot);
ribbon.scale.setScalar(0.0001);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(0xff9ab8), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));

/* ================================================================ particles: pollen, sparks, bursts */
const AMB = 130, POOL = 420, NP = AMB + POOL;
const pPos = new Float32Array(NP * 3), pCol = new Float32Array(NP * 3);
const pts = [];
for (let i = 0; i < NP; i++) {
  const amb = i < AMB;
  pts.push({ amb, x: rand(-3.5, 3.5), y: rand(-3.5, 3.5), z: rand(-3, 3), vx: 0, vy: amb ? rand(0.04, 0.12) : 0, vz: 0, life: amb ? 1 : 0, max: 1, ph: rand(0, TAU), k: rand(0.5, 1) });
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.075, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
}));
points.frustumCulled = false;
scene.add(points);
let poolCursor = AMB;
function emit(x, y, z, vx, vy, vz, life, k) {
  const p = pts[poolCursor];
  poolCursor = poolCursor + 1 >= NP ? AMB : poolCursor + 1;
  Object.assign(p, { x, y, z, vx, vy, vz, life, max: life, k });
}
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpT = new THREE.Vector3(), tmpQa = new THREE.Quaternion();
function burstAt(v, n, speed = 0.55) {
  for (let i = 0; i < n; i++) {
    const d = tmpV2.set(rand(-1, 1), rand(-0.3, 1), rand(-1, 1)).normalize().multiplyScalar(rand(0.25, 1) * speed);
    emit(v.x, v.y, v.z, d.x, d.y + 0.15, d.z, rand(1.4, 2.6), rand(0.7, 1));
  }
}
function updateParticles(now, dt) {
  const t = now / 1000;
  for (let i = 0; i < NP; i++) {
    const p = pts[i];
    let b = 0;
    if (p.amb) {
      if (!reduce) { p.y += p.vy * dt; p.x += Math.sin(t * 0.4 + p.ph) * 0.05 * dt; }
      if (p.y > 3.6) { p.y = -3.6; p.x = rand(-3.5, 3.5); p.z = rand(-3, 3); }
      b = 0.22 + 0.22 * (0.5 + 0.5 * Math.sin(t * 1.3 + p.ph * 3));
    } else if (p.life > 0) {
      p.life -= dt;
      p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.02 * dt; p.vz *= 0.97;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      b = p.k * clamp(p.life / p.max) * smooth(0, 0.15, p.max - p.life);
    }
    pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
    pCol[i * 3] = b; pCol[i * 3 + 1] = b * 0.9; pCol[i * 3 + 2] = b * 0.8;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* ================================================================ falling petals */
const falling = [];
let nextShed = 0;
function shed(now) {
  if (reduce || !ready || now < nextShed) return;
  nextShed = now + rand(2200, 4200);
  if (falling.length > 8) return;
  const cands = flowers.filter((f) => f.type !== "tulip" && f.q[0] > 0.99);
  if (!cands.length) return;
  const f = cands[Math.floor(Math.random() * cands.length)];
  const outer = f.petals.filter((p) => p.li === 0);
  const src = outer[Math.floor(Math.random() * outer.length)];
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.6, transparent: true });
  const m = new THREE.Mesh(src.mesh.geometry, mat);
  src.mesh.getWorldPosition(m.position);
  src.mesh.getWorldQuaternion(m.quaternion);
  src.mesh.getWorldScale(m.scale);
  scene.add(m);
  falling.push({ m, vel: new THREE.Vector3(rand(-0.15, 0.15), 0, rand(-0.15, 0.15)), spin: new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize(), w: rand(1.2, 2.4), t: 0 });
}
function updateFalling(dt) {
  for (let i = falling.length - 1; i >= 0; i--) {
    const f = falling[i];
    f.t += dt;
    f.vel.y = Math.max(f.vel.y - 0.35 * dt, -0.42);
    f.vel.x += Math.sin(f.t * 1.7) * 0.25 * dt;
    f.m.position.addScaledVector(f.vel, dt);
    f.m.quaternion.multiply(tmpQa.setFromAxisAngle(f.spin, f.w * dt));
    f.m.material.opacity = clamp(f.t / 0.3) * (1 - smooth(-2.4, -3.4, f.m.position.y) );
    if (f.m.position.y < -3.4) { scene.remove(f.m); f.m.material.dispose(); falling.splice(i, 1); }
  }
}

/* ================================================================ per-frame flower animation */
const K = 14, DAMP = 3;
const qa = new THREE.Quaternion();
function updateFlower(f, now, dt) {
  const g = reduce ? 1 : easeInOut((now - f.born) / f.growDur);
  f.g = g;
  f.stem.geometry.setDrawRange(0, Math.floor(g * STEM_SEG) * STEM_RAD * 6);

  const gc = Math.max(0.0005, Math.min(g, 0.9995));
  const hs = reduce ? 1 : smooth(0.5, 0.95, g);
  f.root.visible = hs > 0.001;
  if (g < 1) {
    f.curve.getPointAt(gc, f.root.position);
    f.curve.getTangentAt(gc, tmpT);
    qa.setFromUnitVectors(UP, tmpT);
    f.root.quaternion.copy(qa).slerp(f.qFinal, smooth(0.65, 1, g));
  } else {
    f.root.position.copy(f.head);
    f.root.quaternion.copy(f.qFinal);
  }
  f.root.scale.setScalar(Math.max(hs, 0.0001) * f.s);

  // glowing spark that draws the stem
  const sparkA = reduce ? 0 : (g > 0 && g < 1 ? 1 - smooth(0.82, 1, g) : 0);
  f.spark.visible = sparkA > 0;
  if (sparkA > 0) {
    f.curve.getPointAt(gc, f.spark.position);
    f.spark.material.opacity = sparkA * 0.95;
    f.sparkAcc += dt * 18;
    if (f.sparkAcc > 1) {
      f.spark.getWorldPosition(tmpV);
      while (f.sparkAcc > 1) { f.sparkAcc -= 1; emit(tmpV.x + rand(-0.02, 0.02), tmpV.y, tmpV.z + rand(-0.02, 0.02), rand(-0.05, 0.05), rand(-0.12, 0.02), rand(-0.05, 0.05), rand(0.5, 1.1), rand(0.5, 0.9)); }
    }
  }

  // bloom (with a twirl when tapped)
  const bStart = f.born + f.growDur + 100;
  let ff = 1, ft = 0;
  if (f.flutterAt) {
    const u = (now - f.flutterAt) / 1400;
    if (u >= 1) f.flutterAt = 0;
    else { const sn = Math.sin(Math.PI * u); ff = 1 - 0.5 * sn; ft = 0.9 * sn; }
  }
  for (let i = 0; i < f.q.length; i++) {
    f.q[i] = reduce ? 1 : backOut((now - bStart - f.T.layers[i].d * f.bloomDur) / f.bloomDur);
  }
  const q0 = clamp(f.q[0] * ff, 0, 1.06);
  for (const p of f.petals) {
    const li = p.li, q = li < 0 ? q0 : f.q[li] * ff, ly = p.ly;
    const twist = li < 0 ? 0 : f.tw * ((1 - clamp(q)) * (0.85 + 0.3 * li) + ft * (0.6 + 0.25 * li));
    p.pivot.rotation.y = p.phi + twist;
    p.tilt.rotation.x = (ly.bud + (ly.open - ly.bud) * q) * DEG;
    p.mesh.scale.setScalar(lerp(ly.bs, 1, Math.min(q, 1.03)) * p.Lj);
  }
  f.mat.userData.uSat.value = lerp(0.18, 1, smooth(0, 0.75, clamp(f.q[0])));
  if (f.center) f.center.scale.setScalar(Math.max(0.0001, smooth(0.2, 0.85, q0)));

  if (!f.flashed && f.q[0] > 0.06 && !reduce) { f.flashed = true; bloomFx(f, 1); }

  // light: steady glow + flash + ring
  let fl = 0, ringU = 1;
  if (f.flashAt) {
    const u = (now - f.flashAt) / 1700;
    if (u >= 1) f.flashAt = 0;
    else { fl = (u < 0.12 ? u / 0.12 : Math.pow(1 - (u - 0.12) / 0.88, 2)) * f.flashK; ringU = u; }
  }
  f.mat.emissiveIntensity = 0.03 * clamp(f.q[0]) + 0.22 * fl;
  f.glow.material.opacity = 0.07 * clamp(f.q[0]) + 0.26 * fl;
  f.glow.scale.setScalar(2.2 + 0.8 * fl);
  f.ring.visible = ringU < 1;
  if (ringU < 1) {
    f.ring.material.opacity = 0.2 * Math.pow(1 - ringU, 2) * f.flashK;
    f.ring.scale.setScalar(lerp(1.2, 4.6, easeOut(ringU)));
  }

  // springy sway + idle breathing
  f.vx += (-K * f.sx - DAMP * f.vx) * dt; f.sx += f.vx * dt;
  f.vz += (-K * f.sz - DAMP * f.vz) * dt; f.sz += f.vz * dt;
  const t = now / 1000;
  f.bob.rotation.x = f.sx + (reduce ? 0 : 0.03 * Math.sin(t * 0.9 + f.ph));
  f.bob.rotation.z = f.sz + (reduce ? 0 : 0.03 * Math.sin(t * 0.7 + f.ph * 2));
}

function bloomFx(f, k) {
  f.flashAt = performance.now();
  f.flashK = k;
  f.root.getWorldPosition(tmpV);
  burstAt(tmpV, Math.round(14 * k));
  // the pulse nudges neighbouring flowers
  for (const o of flowers) {
    if (o === f || o.g < 0.6) continue;
    const d = o.head.distanceTo(f.head);
    if (d < 1.4) {
      const push = 0.9 * (1 - d / 1.4) * k;
      o.vx += (Math.random() < 0.5 ? -1 : 1) * push;
      o.vz += (Math.random() < 0.5 ? -1 : 1) * push;
    }
  }
}

/* ================================================================ camera fit */
let W = 1, H = 1, bandTop = 0, fitDist = 12, started = false, ready = false;
const probe = document.createElement("div");
probe.style.cssText = "position:fixed;top:0;left:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top)";
document.body.appendChild(probe);
const TARGET = new THREE.Vector3(0, -0.2, 0);
const BOUNDS_H = 4.75, BOUNDS_W = 4.0;

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const safeTop = parseFloat(getComputedStyle(probe).paddingTop) || 0;
  const titleH = $("title").offsetHeight;
  const top = started ? Math.min(H * 0.5, safeTop + (H < 560 ? 14 : 28) + titleH + 4) : H * 0.18;
  const bottom = started ? 72 : 40;   // room for the P.S. and the hint
  const availH = Math.max(H * 0.4, H - top - bottom);
  const tanH = Math.tan((camera.fov * DEG) / 2);
  fitDist = Math.max(BOUNDS_H / ((availH / H) * 2 * tanH), BOUNDS_W / (0.94 * 2 * tanH * camera.aspect));
  const shift = top + availH / 2 - H / 2;
  camera.setViewOffset(W, H, 0, -shift, W, H);
  camera.updateProjectionMatrix();
}

/* ================================================================ interaction */
let yaw = -0.5, pitch = 0, yawVel = 0, dragging = false, lastX = 0, lastY = 0, lastT = 0, downAt = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

canvas.addEventListener("pointerdown", (e) => {
  downAt = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  if (started) dragging = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener("pointermove", (e) => {
  if (!downAt) return;
  const now = performance.now(), dx = e.clientX - lastX, dy = e.clientY - lastY;
  downAt.moved += Math.hypot(dx, dy);
  if (dragging && downAt.moved > 6) {
    const k = 5.5 / Math.max(W, 320);
    yaw += dx * k;
    pitch = clamp(pitch + dy * k * 0.5, -0.32, 0.4);
    yawVel = (dx * k) / Math.max(0.008, (now - lastT) / 1000);
    if (downAt.moved > 40) $("hint").classList.add("gone");
  }
  lastX = e.clientX; lastY = e.clientY; lastT = now;
});
function endPointer(e) {
  const d = downAt; downAt = null; dragging = false;
  if (!d) return;
  if (d.moved < 10 && performance.now() - d.t < 700) {
    if (!started) start();
    else tapAt(e.clientX, e.clientY);
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", () => { downAt = null; dragging = false; });
window.addEventListener("keydown", (e) => { if (!started && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); start(); } });

function tapAt(x, y) {
  ndc.set((x / W) * 2 - 1, -(y / H) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  if (hit && hit.object.userData.f) {
    const f = hit.object.userData.f;
    if (f.q[0] > 0.6 && (!f.flutterAt || performance.now() - f.flutterAt > 700)) {
      f.flutterAt = performance.now();
      f.vx += rand(-0.6, 0.6); f.vz += rand(-0.6, 0.6);
      bloomFx(f, 0.85);
    }
  } else {
    yawVel += (x < W / 2 ? -1 : 1) * 1.2;   // a tap beside the bouquet gives it a gentle spin
  }
}

/* ================================================================ story */
let T0 = 0;
const later = (fn, ms) => setTimeout(fn, reduce ? 0 : ms);
function start() {
  if (started) return;
  started = true;
  docEl.classList.add("started");
  layout();
  setTimeout(layout, 1900);
  T0 = performance.now();
  const order = flowers.map((f, i) => ({ f, k: f.spec.pol * 10 + ((f.spec.az + 30) % 360) / 40 })).sort((a, b) => a.k - b.k);
  let firstBloom = Infinity, lastBloom = 0;
  order.forEach(({ f }, r) => {
    f.born = T0 + 350 + r * 120;
    f.growDur = 2500 + rand(-150, 150);
    f.bloomDur = 2100;
    firstBloom = Math.min(firstBloom, f.born + f.growDur - T0);
    lastBloom = Math.max(lastBloom, f.born + f.growDur + 100 + (f.T.maxD + 1) * f.bloomDur - T0);
  });
  ribbonAt = T0 + lastBloom - 1600;
  bbAt = T0 + firstBloom + 900;
  later(() => $("l1").classList.add("show"), firstBloom + 900);
  later(() => $("l2").classList.add("show"), firstBloom + 2600);
  later(() => { docEl.classList.add("ready"); ready = true; }, lastBloom - 300);
  later(() => $("ps").classList.add("show"), lastBloom + 2200);
}
let ribbonAt = Infinity, bbAt = Infinity, bbDone = false;

/* ================================================================ frame loop */
let prev = performance.now();
const camPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - prev) / 1000));
  prev = now;
  const t = started ? (reduce ? 1e9 : now - T0) : 0;

  // camera: a slow push from close and low to the full bouquet
  const intro = started ? easeInOut(t / 7800) : 0;
  const dist = fitDist * lerp(0.62, 1, intro);
  const el = lerp(0.0, 0.17, intro);
  camPos.set(0, Math.sin(el) * dist, Math.cos(el) * dist).add(TARGET);
  camera.position.copy(camPos);
  camera.lookAt(TARGET);

  // turntable: slow auto rotation, drag with inertia
  if (!dragging && !reduce) {
    const base = started ? 0.16 : 0.05;
    yawVel += (base - yawVel) * Math.min(1, dt * 1.6);
    yaw += yawVel * dt;
    pitch += (0 - pitch) * Math.min(1, dt * 0.8);
  }
  bouquet.rotation.x = pitch;
  bouquet.rotation.y = yaw;

  for (const f of flowers) updateFlower(f, now, dt);

  for (const l of leaves) {
    const u = started ? (reduce ? 1 : (t - l.delay) / 1100) : 0;
    l.inner.scale.setScalar(Math.max(0.0001, backOut(u)));
    l.inner.rotation.x = (1 - clamp(u)) * -0.9;
  }

  if (!bbDone && started) {
    let all = true;
    for (let i = 0; i < bbDots.length; i++) {
      const u = reduce ? 1 : (now - bbAt - bbDots[i].delay) / 500;
      if (u < 1) all = false;
      setBB(i, backOut(u) * bbDots[i].s);
    }
    bbMesh.instanceMatrix.needsUpdate = true;
    bbDone = all;
  }

  const ru = reduce ? 1 : (now - ribbonAt) / 1100;
  ribbon.scale.setScalar(Math.max(0.0001, backOut(ru)) * 1.35);
  ribbon.rotation.y = (1 - clamp(ru)) * -2.2;

  let bloomed = 0;
  for (const f of flowers) bloomed += clamp(f.q[0]);
  halo.material.opacity = (bloomed / flowers.length) * (0.16 + (reduce ? 0 : 0.03 * Math.sin(now / 1400)));

  shed(now);
  updateFalling(dt);
  updateParticles(now, dt);
  renderer.render(scene, camera);
}

window.addEventListener("resize", layout);
layout();
renderer.setAnimationLoop(frame);
</script>
</body>
</html>
